<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Writing Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-open">
  <div id="backgroundLayer" class="background-layer"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">MY EDITOR</div>
          <div class="brand-subtitle">Writing Space</div>
        </div>
      </div>

      <button class="new-slot-btn" id="newSlotBtn">＋ 새 슬롯</button>
      <div class="slot-section-title">PAGES</div>
      <div id="slotList" class="slot-list"></div>

      <div class="sidebar-bottom">
        <button class="side-btn" id="exportAllBtn">전체 백업</button>
        <label class="side-btn file-label" for="importBackupInput">백업 불러오기</label>
        <input id="importBackupInput" type="file" accept=".json,application/json" hidden>
        <button class="side-btn danger" id="resetBtn">전체 초기화</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumb"><span id="currentSlotLabel">SLOT 01</span></div>
        <div class="top-actions">
          <span id="saveStatus" class="save-status">자동 저장됨</span>
          <button class="ghost-btn" id="settingsBtn">꾸미기</button>
          <button class="ghost-btn" id="copyBtn">복사</button>
          <div class="export-menu-wrap">
          <button class="primary-btn" id="exportMenuBtn">저장 ▾</button>
          <div class="export-menu" id="exportMenu">
            <button type="button" data-export="png">PNG로 저장</button>
            <button type="button" data-export="jpg">JPG로 저장</button>
            <button type="button" data-export="pdf">PDF로 저장</button>
            <button type="button" data-export="txt">TXT로 저장</button>
          </div>
        </div>
        </div>
      </header>

      <section class="workspace">
        <div class="document-page" id="documentPage">
          <input id="titleInput" class="title-input" type="text" placeholder="제목을 입력하세요">
          <input id="subtitleInput" class="subtitle-input" type="text" placeholder="소제목을 입력하세요">

          <div class="toolbar compact-toolbar" role="toolbar" aria-label="빠른 편집 도구">
            <button data-command="undo" title="실행 취소">↶</button>
            <button data-command="redo" title="다시 실행">↷</button>
            <span class="divider"></span>
            <button data-command="insertUnorderedList" title="글머리 목록">• 목록</button>
            <button data-command="insertOrderedList" title="번호 목록">1. 목록</button>
            <button id="hrBtn" title="구분선">―</button>
            <button id="linkBtn" title="링크">🔗</button>
            <button id="imageBtn" title="본문 이미지">🖼</button>
            <button id="clearFormatBtn" title="서식 지우기">Tx</button>
          </div>

          <article id="editor" class="editor" contenteditable="true" spellcheck="true"
            data-placeholder="이곳에 글을 작성하세요."></article>

          <div class="page-footer">
            <span class="page-number" id="pageNumberPreview">— 01 —</span>
          </div>
        </div>
      </section>

      <footer class="statusbar">
        <span id="wordCount">0자</span>
        <span id="lastSaved">아직 저장하지 않음</span>
      </footer>
    </main>

  </div>

  <div class="drawer-backdrop open" id="drawerBackdrop"></div>
  <aside class="settings-drawer open" id="settingsDrawer">
    <div class="drawer-head">
      <div>
        <div class="drawer-kicker">EDITOR PANEL</div>
        <h2>편집 설정</h2>
      </div>
      <button class="drawer-close" id="closeSettingsBtn">×</button>
    </div>

    <div class="settings-tabs" role="tablist">
      <button class="settings-tab active" data-tab="text">글씨 편집</button>
      <button class="settings-tab" data-tab="background">문서 배경</button>
      <button class="settings-tab" data-tab="document">문서 설정</button>
    </div>

    <div class="tab-panel active" data-panel="text">
      <section class="setting-section first-section">
        <h3>글꼴 · 크기</h3>
        <div class="stack-field">
          <label>글꼴</label>
          <select id="fontSelect">
            <option value="Pretendard">Pretendard</option>
            <option value="Noto Sans KR">Noto Sans KR</option>
            <option value="KoPubWorld Batang">KoPubWorld 바탕</option>
            <option value="KoPubWorld Dotum">KoPubWorld 돋움</option>
            <option value="">시스템 기본</option>
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
          </select>
        </div>

        <div class="stack-field">
          <label>글자 크기</label>
          <select id="fontSizeSelect">
            <option value="">선택</option>
            <option value="1">10px</option>
            <option value="2">13px</option>
            <option value="3">16px</option>
            <option value="4">18px</option>
            <option value="5">24px</option>
            <option value="6">32px</option>
            <option value="7">48px</option>
          </select>
        </div>

        <div class="format-grid">
          <button data-command="bold"><strong>B</strong></button>
          <button data-command="italic"><em>I</em></button>
          <button data-command="underline"><u>U</u></button>
          <button data-command="strikeThrough"><s>S</s></button>
        </div>

        <div class="color-grid">
          <label class="color-card"><span>글자색</span><input id="textColor" type="color" value="#292826"></label>
          <label class="color-card"><span>형광펜</span><input id="highlightColor" type="color" value="#fff0a8"></label>
        </div>
      </section>

      <section class="setting-section">
        <h3>문단 스타일</h3>
        <div class="stack-field">
          <label>문단 종류</label>
          <select id="blockSelect">
            <option value="p">본문</option>
            <option value="h1">제목 1</option>
            <option value="h2">제목 2</option>
            <option value="h3">제목 3</option>
            <option value="blockquote">인용문</option>
          </select>
        </div>

        <div class="format-grid align-grid">
          <button data-command="justifyLeft">⇤</button>
          <button data-command="justifyCenter">≡</button>
          <button data-command="justifyRight">⇥</button>
          <button data-command="justifyFull">☰</button>
          <button data-command="outdent">⇠</button>
          <button data-command="indent">⇢</button>
        </div>
      </section>

      <section class="setting-section">
        <h3>자간 · 행간 · 문단</h3>
        <div class="setting-row">
          <label>자간</label>
          <input id="globalLetterSpacing" type="range" min="-8" max="20" value="0">
          <span id="globalLetterSpacingValue">0em</span>
        </div>
        <div class="setting-row">
          <label>행간</label>
          <input id="globalLineHeight" type="range" min="120" max="260" value="178">
          <span id="globalLineHeightValue">1.78</span>
        </div>
        <div class="setting-row">
          <label>문단 간격</label>
          <input id="globalParagraphSpacing" type="range" min="0" max="40" value="0">
          <span id="globalParagraphSpacingValue">0px</span>
        </div>
      </section>

      <section class="setting-section">
        <h3>사용자 폰트</h3>
        <p>TTF, OTF, WOFF, WOFF2 파일을 추가할 수 있어요.</p>
        <label class="upload-btn" for="fontFileInput">＋ 폰트 파일 추가</label>
        <input id="fontFileInput" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
        <div id="customFontList" class="asset-list"></div>
      </section>
    </div>

    <div class="tab-panel" data-panel="background">
      <section class="setting-section first-section">
        <h3>문서 배경 방식</h3>
        <div class="segmented">
          <button class="bg-mode active" data-mode="solid">단색</button>
          <button class="bg-mode" data-mode="gradient">그라데이션</button>
          <button class="bg-mode" data-mode="image">이미지</button>
        </div>
        <div class="setting-row"><label>단색</label><input id="solidColorInput" type="color" value="#ffffff"></div>
        <div class="setting-row"><label>그라데이션 1</label><input id="gradientColor1" type="color" value="#f5f4f1"></div>
        <div class="setting-row"><label>그라데이션 2</label><input id="gradientColor2" type="color" value="#d9d8e8"></div>
        <div class="setting-row">
          <label>각도</label>
          <input id="gradientAngle" type="range" min="0" max="360" value="135">
          <span id="gradientAngleValue">135°</span>
        </div>
      </section>

      <section class="setting-section">
        <h3>배경 이미지</h3>
        <label class="upload-btn" for="backgroundFileInput">＋ 이미지 파일 추가</label>
        <input id="backgroundFileInput" type="file" accept="image/*" hidden>
        <div class="setting-row">
          <label>맞춤</label>
          <select id="backgroundSizeSelect">
            <option value="cover">화면 채우기</option>
            <option value="contain">전체 보이기</option>
            <option value="auto">원본 크기</option>
          </select>
        </div>
        <div class="setting-row">
          <label>반복</label>
          <select id="backgroundRepeatSelect">
            <option value="no-repeat">반복 안 함</option>
            <option value="repeat">반복</option>
            <option value="repeat-x">가로 반복</option>
            <option value="repeat-y">세로 반복</option>
          </select>
        </div>
        <div class="setting-row">
          <label>밝기</label>
          <input id="backgroundBrightness" type="range" min="40" max="140" value="100">
          <span id="backgroundBrightnessValue">100%</span>
        </div>
        <input id="backgroundBlur" type="range" min="0" max="0" value="0" hidden>
        <span id="backgroundBlurValue" hidden>0px</span>
      </section>

      <section class="setting-section">
        <h3>글 영역</h3>
        <div class="setting-row"><label>색</label><input id="paperColorInput" type="color" value="#ffffff"></div>
        <div class="setting-row">
          <label>투명도</label>
          <input id="paperOpacity" type="range" min="35" max="100" value="100">
          <span id="paperOpacityValue">100%</span>
        </div>
      </section>

      <button class="reset-appearance" id="resetAppearanceBtn">배경 설정 초기화</button>
    </div>

    <div class="tab-panel" data-panel="document">
      <section class="setting-section first-section">
        <h3>슬롯</h3>
        <div class="stack-field">
          <label>슬롯 이름</label>
          <input id="slotNameInput" class="panel-text-input" type="text">
        </div>
        <button class="outline-btn" id="renameBtn">슬롯 이름 변경</button>
        <button class="outline-btn delete" id="deleteSlotBtn">현재 슬롯 삭제</button>
      </section>

      <section class="setting-section">
        <h3>쪽번호</h3>
        <div class="page-number-grid">
          <input id="pagePrefixInput" class="panel-text-input small" type="text" placeholder="앞" maxlength="8">
          <input id="pageNumberInput" class="panel-text-input small center" type="text" placeholder="01" maxlength="12">
          <input id="pageSuffixInput" class="panel-text-input small" type="text" placeholder="뒤" maxlength="8">
        </div>
      </section>

      <section class="setting-section">
        <h3>문서 정보</h3>
        <div class="document-meta-row"><span>최근 수정</span><strong id="updatedAt">-</strong></div>
        <div class="document-meta-row"><span>글자 수</span><strong id="docInfo">0자</strong></div>
      </section>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
